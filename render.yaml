services:
  - type: web
    name: deal-api
    runtime: node
    plan: free
    region: frankfurt
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm --workspace @deal/backend run build
    # Render's free plan has no pre-deploy command. Prisma migrate deploy is
    # idempotent and takes a database advisory lock, so running it before every
    # process start is the safest free-tier substitute. A migration failure
    # prevents the API from accepting traffic.
    startCommand: npm --workspace @deal/backend run db:deploy && npm --workspace @deal/backend run start
    healthCheckPath: /health/ready
    buildFilter:
      paths:
        - backend/**
        - package.json
        - package-lock.json
        - .node-version
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: 1
      - key: MAX_JSON_BODY_KB
        value: 100
      - key: FRONTEND_URL
        fromService:
          type: web
          name: deal-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NEON_DATABASE_URL
        sync: false
      - key: NEON_DIRECT_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_S3_ENDPOINT
        sync: false
      - key: FLW_SECRET_KEY
        sync: false
      - key: FLW_WEBHOOK_SECRET_HASH
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false

  - type: web
    name: deal-web
    runtime: node
    plan: free
    region: frankfurt
    autoDeployTrigger: checksPass
    buildCommand: npm ci && npm --workspace @deal/frontend run build
    startCommand: npm --workspace @deal/frontend run start
    healthCheckPath: /
    buildFilter:
      paths:
        - frontend/**
        - package.json
        - package-lock.json
        - .node-version
    envVars:
      - key: NODE_ENV
        value: production
      # Free web services cannot receive Render private-network traffic. Keep
      # browser requests same-origin, but let the Next server proxy them to the
      # API's public TLS origin instead.
      - key: DEAL_API_ORIGIN
        fromService:
          type: web
          name: deal-api
          envVarKey: RENDER_EXTERNAL_URL
